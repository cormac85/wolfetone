services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: tailscale
    network_mode: host  # Allows access to host ports (e.g., Nextcloud) and links to host UFW
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ../../app-data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=wolfetone  # Avoids a random container ID hash in your admin console
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    # Injects ntfy directly into the tailscale node's network namespace
    network_mode: "service:tailscale"
    environment:
      - NTFY_BASE_URL=http://wolfetone.tailee21f7.ts.net:8081
      - NTFY_AUTH_DEFAULT_ACCESS=write-only
      - NTFY_LISTEN_HTTP=:8081
    volumes:
      - /var/cache/ntfy:/var/cache/ntfy
      - /var/lib/ntfy:/var/lib/ntfy
    command:
      - serve
    restart: unless-stopped
