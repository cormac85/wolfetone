services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - ../../app-data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - CADDY_TAILSCALE_IP=${TAILSCALE_WOLFETONE_IP}
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/run/dbus/system_bus_socket
  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ~/docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
  rtl_433:
    image: hertzg/rtl_433:master-debian
    container_name: rtl_433
    restart: unless-stopped
    privileged: true
    user: "0:0"
    devices:
      - /dev/bus/usb:/dev/bus/usb
    command: -d 0 -f 868.3M -s 1024k -g 40 -p 1 -R 0 -X 'n=climote,m=FSK_PCM,s=488,l=488,r=4000,bits=172' -F mqtt://mosquitto:1883,events=rtl_433/raw
    depends_on:
      - mosquitto
