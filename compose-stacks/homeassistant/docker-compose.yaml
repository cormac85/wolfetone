services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - ../../app-data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - CADDY_TAILSCALE_IP=${TAILSCALE_WOLFETONE_IP}
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/run/dbus/system_bus_socket
  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ~/docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
  climote-decoder:
    build:
      context: ./climote-decoder
    container_name: climote-decoder
    restart: unless-stopped
    privileged: true
    # Pass through the USB bus so the container can access the RTL-SDR dongle
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - MQTT_HOST=mosquitto # Matches your broker service name in compose
      - MQTT_PORT=1883
    depends_on:
      - mosquitto
