# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - 100.83.211.123
    - 172.16.0.0/12  # docker subnet

mqtt:
  sensor:
    - name: "Climote Temperature"
      state_topic: "climote/sensor/state"
      unit_of_measurement: "°C"
      icon: mdi:thermometer-auto
      device_class: "temperature"
      state_class: "measurement"
      force_update: true
      value_template: >
        {% set temp = value_json.temperature_c | float(-999) %}
        {% if 0 < temp < 50 %}
          {{ temp }}
        {% else %}
          {{ states('sensor.climote_temperature') }}
        {% endif %}

template:
  - sensor:
      - name: "Climote Signal Age"
        unit_of_measurement: "minutes"
        icon: mdi:clock-fast
        state: >
          {% set entity_id = 'sensor.climote_temperature' %}
          {% if states[entity_id] is not none and states[entity_id].last_updated is not none %}
            {{ ((now() - states[entity_id].last_updated).total_seconds() / 60) | round(1) }}
          {% else %}
            unknown
          {% endif %}