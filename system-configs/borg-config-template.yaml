source_directories:
    # Back up the snapshot directory generated by maintain.sh
    - /mnt/backups/nextcloud
    # Home Assistant config/state (history DB and logs excluded, see exclude_patterns)
    - /home/cormac/docker/app-data/homeassistant

exclude_patterns:
    # Recorder history: huge, constantly written (inconsistent live copy) and expendable
    - /home/cormac/docker/app-data/homeassistant/home-assistant_v2.db*
    - /home/cormac/docker/app-data/homeassistant/home-assistant.log*
    # Regenerated on startup
    - /home/cormac/docker/app-data/homeassistant/tts
    - /home/cormac/docker/app-data/homeassistant/.cache
    - /home/cormac/docker/app-data/homeassistant/deps

repositories:
    # Format: ssh://user@host/path
    - path: ssh://datashank-borg/mnt/media_500gb/wolfetone_backups
      label: datashank_hdd
    # Commented out to prevent exit status 13 crashes:
    # - path: /mnt/local_storage/wolfetone_local.borg
    #   label: local_disk

keep_daily: 7
keep_weekly: 4
keep_monthly: 6

encryption_passphrase: "not a password"

# Flattened to remove the deprecation warning entirely
checks:
    - name: repository
    - name: archives
check_last: 3  # Validates the integrity of the last 3 archives
